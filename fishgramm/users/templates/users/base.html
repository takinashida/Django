<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Главная{% endblock %}</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="/static/css/bootstrap.min.css">
  <style>
    body {
      background: linear-gradient(20deg, #ff6600, #fff9cc);
    }
  </style>
</head>
<body class="d-flex justify-content-center align-items-center vh-100 position-relative">

  <!-- Логотип -->
  <div class="position-absolute top-0 start-0 m-3">
    <img src="/static/icons/Fish_logo.png" alt="Логотип" width="100">
  </div>

  <!-- Карточка с формой аутентификации -->
  {% block content %}{% endblock %}

  <!-- Bootstrap JS Bundle -->
<script src="/static/js/bootstrap.bundle.min.js"></script>
</body>
</html>
