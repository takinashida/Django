{% extends 'blog/base.html' %}
{% block title %}Удаление поста{% endblock %}

{% block content %}
<div class="col-9" style="background-color:#dbe9ff">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 class="text-center">Удаление поста.</h2>
            <form method="post" enctype="multipart/form-data">
                <div class="card">
                    <p class=" card-text">Действительно хотите удалить {{ object.title }}?</p>
                    <div class="card-body">
                        {% csrf_token %}
                    </div>
                    <button type="submit" class="btn " style="background-color: #019ff9;">
                        Удалить
                    </button>
                    <a href='{% url "blog:post_list"%}' class="btn " style="background-color: #019ff9;">
                        Нет
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
