{% extends 'base.html' %}
{% block title %}Добавление продукта{% endblock %}

{% block content %}
<div class="col-9">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 class="text-center">Добавить продукт</h2>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn text-white" style="background-color: #660001;">Сохранить</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
