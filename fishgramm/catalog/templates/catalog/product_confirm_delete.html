{% extends 'catalog/base.html' %}
{% block title %}Удаление продукта{% endblock %}

{% block content %}
<div class="col-9">
    {% if user.is_authenticated %}
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 class="text-center">Добавить продукт</h2>
            <form method="post" enctype="multipart/form-data">
                <div class="card">
                    <p class=" card-text">Действительно хотите удалить {{ object.name }}?</p>
                    <div class="card-body">
                        {% csrf_token %}
                    </div>
                    <button type="submit" class="btn text-white" style="background-color: #660001;">
                        Удалить
                    </button>
                    <a href='{% url "catalog:product_list"%}' class="btn text-white" style="background-color: #660001;">
                        Нет
                    </a>
                </div>
            </form>
        </div>
    </div>
    {% else %}
    <div class="row justify-content-center">
        <div class="card border-0 shadow-lg w-100" style="background-color: #ffebf7;">
            <div class="text-center">
                    <span class="fs-3 p-3">Авторизуйтесь</span>
            </div>
        </div>
    </div>
    {% endif %}
</div>
{% endblock %}
