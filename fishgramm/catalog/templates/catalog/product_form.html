{% extends 'base.html' %}
{% block title %}Добавление продукта{% endblock %}

{% block content %}
<div class="col-9">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 class="text-center">Добавить продукт</h2>
            <form method="post" enctype="multipart/form-data">
                <div class="card">
                    <div class="card-body">
                        {% csrf_token %}
                        {{ form.as_p }}
                    </div>
                    <button type="submit" class="btn btn-primary">
                        {% if object %}
                        Сохранить
                        {% else %}
                        Создать
                        {% endif %}
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>
{% endblock %}
