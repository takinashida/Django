{% extends 'catalog/base.html' %}
{% block title %}Сообщение успешно передано{% endblock %}

{% block content %}
<div class="col-9">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 class="text-center">Уведомление</h2>
            <form method="post" enctype="multipart/form-data">
                <div class="card">
                    <p class=" card-text">Ваше сообщение успешно отправлено, спасибо за обратную связь!</p>

                    <a href='{% url "catalog:product_list" %}' class="btn text-white" style="background-color: #660001;">
                        Вернуться на главную
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
